name: Auto Build Catalog

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '[0-9]*/**'
      - 'build_catalog.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # cần full history để build_catalog.py biết game được thêm vào repo lúc nào

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build catalog.json
        run: |
          python build_catalog.py

      - name: Commit ready_builds.json files only (not catalog.json)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add '[0-9]*/ready_builds.json'
          if git diff --staged --quiet; then
            echo "No changes in ready_builds.json files"
          else
            git commit -m "Auto-update ready_builds.json [skip ci]"
            git push
          fi
